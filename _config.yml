title: "CMDB"
name: "CMDB"
description: "Configuration Management Database"
url: "https://cmdb.osoyalce.com"
baseurl: ""
mycount:
  endpoint: "https://count.osoyalce.com/count"
  site: "cmdb"
repository: "NadimGhaznavi/cmdb"
logo: "/pages/images/cmdb.png"
locale: "en-US"
remote_theme: "NadimGhaznavi/minimal-mistakes"
minimal_mistakes_skin: "dark"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap

author:
  name: "Nadim-Daniel Ghaznavi"
  avatar: # path of avatar image, e.g. "/assets/images/bio-photo.jpg"
  bio: "Creator"
  location: "Hamilton, ON"
  email: "nghaznavi@gmail.com"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/NadimGhaznavi"
    - label: "My Website"
      icon: "fas fa-fw fa-link"
      url: "https://www.osoyalce.com/"


footer:
  since: "2026"

include:
  - pages
exclude:
  - AGENTS.md
  - README.md
  - LICENSE
  - scripts
  - cmdb
  - cmdb-server.py
  - requirements.txt
  - systemd
  - tests
  - vendor
  - .venv

defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true
