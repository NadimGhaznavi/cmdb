<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMDB</title>
  <link rel="stylesheet" href="/static/machines.css">
  <script defer src="/static/vendor/cytoscape-3.34.3.min.js"></script>
  <script defer src="/static/machines.js"></script>
</head>
<body>
  <header>
    <h1>CMDB</h1>
    <p>Configuration Management Database</p>
    <hr>
  </header>
  <main aria-label="Machines">
    <p id="graph-status" role="status">Loading machines…</p>
    <noscript>Enable JavaScript to view machines.</noscript>
    <div class="machine-workspace">
      <aside id="selection-details" aria-label="Selection details" hidden>
        <details id="machine-details" open>
          <summary id="machine-heading"></summary>
          <table aria-label="Machine details">
            <tbody>
              <tr><th scope="row">{{label.ipAddress}}:</th><td id="detail-ipAddress"></td></tr>
              <tr><th scope="row">{{label.macAddress}}:</th><td id="detail-macAddress"></td></tr>
              <tr><th scope="row">{{label.hostName}}:</th><td id="detail-hostName"></td></tr>
              <tr><th scope="row">{{label.createdOn}}:</th><td id="detail-createdOn"></td></tr>
              <tr><th scope="row">{{label.updatedOn}}:</th><td id="detail-updatedOn"></td></tr>
            </tbody>
          </table>
        </details>
        <div id="software-details"></div>
        <template id="software-detail-template">
          <details class="software-detail">
            <summary></summary>
            <table aria-label="Software system details">
              <tbody>
                <tr><th scope="row">{{label.type}}:</th><td data-field="type"></td></tr>
                <tr><th scope="row">{{label.subtype}}:</th><td data-field="subtype"></td></tr>
                <tr><th scope="row">{{label.supplier}}:</th><td data-field="supplier"></td></tr>
                <tr><th scope="row">{{label.version}}:</th><td data-field="version"></td></tr>
                <tr><th scope="row">{{label.codename}}:</th><td data-field="codename"></td></tr>
                <tr><th scope="row">{{label.databases}}:</th><td data-field="databases"></td></tr>
              </tbody>
            </table>
          </details>
        </template>
      </aside>
      <div class="graph-area"><div id="machine-graph" aria-label="Machine graph"></div></div>
    </div>
  </main>
  <footer class="page-footer">
    <div class="page-actions">
      <button id="refresh-button" type="button">Refresh</button>
    </div>
    <p>Last refresh: <time id="last-refresh" datetime="{{last_refresh}}">{{last_refresh}}</time></p>
  </footer>
</body>
</html>
