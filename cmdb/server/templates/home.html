<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMDB</title>
  <link rel="stylesheet" href="/static/machines.css">
  <script defer src="/static/vendor/cytoscape-3.34.3.min.js"></script>
  <script defer src="/static/machines.js"></script>
</head>
<body>
  <header>
    <h1>CMDB</h1>
    <p>Configuration Management Database</p>
    <hr>
  </header>
  <main aria-label="Machines">
    <div class="panel-heading">
      <label for="machine-picker">Machine
        <select id="machine-picker" disabled><option value="">Select a machine</option></select>
      </label>
    </div>
    <p id="graph-status" role="status">Loading machines…</p>
    <noscript>Enable JavaScript to view machines.</noscript>
    <div class="machine-workspace">
      <section id="machine-details" aria-label="Selected machine" hidden>
        <table aria-label="Machine details">
          <tbody>
            <tr><th scope="row">ipAddress:</th><td id="detail-ipAddress"></td></tr>
            <tr><th scope="row"><label for="hostname-input">hostName:</label></th><td>
              <span id="detail-hostName"></span>
              <input id="hostname-input" type="text" maxlength="255" autocomplete="off" hidden>
            </td></tr>
            <tr><th scope="row">site:</th><td id="detail-site"></td></tr>
            <tr><th scope="row">deployedComponent:</th><td id="detail-deployedComponent"></td></tr>
            <tr><th scope="row">createdOn:</th><td id="detail-createdOn"></td></tr>
            <tr><th scope="row">updatedOn:</th><td id="detail-updatedOn"></td></tr>
          </tbody>
        </table>
        <div class="page-actions detail-actions">
          <button id="edit-button" type="button" hidden>Edit</button>
          <button id="save-button" type="button" hidden>Save</button>
          <button id="cancel-button" type="button" hidden>Cancel</button>
        </div>
        <p id="edit-status" role="status"></p>
      </section>
      <div class="graph-area"><div id="machine-graph" aria-label="Machine graph"></div></div>
    </div>
  </main>
  <footer class="page-footer">
    <div class="page-actions">
      <button id="refresh-button" type="button">Refresh</button>
    </div>
    <p>Last refresh: <time id="last-refresh" datetime="{{last_refresh}}">{{last_refresh}}</time></p>
  </footer>
</body>
</html>
